services:
  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--port", "${REDIS_PORT:-6379}", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Shared app image (rag-app): API uses reload CMD; ingest-worker overrides command.
  # Bind-mount app source only; image keeps .venv / alembic / main.py.
  backend:
    image: rag-app
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
    volumes:
      - ./backend/app:/app/app
      - uploads:/var/rag/uploads
    # --reload is incompatible with multiple workers; prod keeps UVICORN_WORKERS via image CMD.
    command: [ "uvicorn", "app.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/live')" ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  ingest-worker:
    image: rag-app
    build:
      context: ./backend
    command: [ "python", "-m", "app.workers.ingest" ]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
    volumes:
      - ./backend/app:/app/app
      - uploads:/var/rag/uploads
      - hf-cache:/var/rag/hf
      - xdg-cache:/var/rag/cache
    depends_on:
      redis:
        condition: service_healthy
    shm_size: "1gb"
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; from redis import Redis; Redis.from_url(os.environ['REDIS_URL']).ping()" ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  frontend:
    image: rag-frontend
    build:
      target: development
      context: ./frontend
      args:
        BACKEND_URL: ${BACKEND_URL:-/api}
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}

    environment:
      BACKEND_URL: "/api"

    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:5173" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    restart: unless-stopped

volumes:
  uploads:
  hf-cache:
  xdg-cache:
  redis-data:
  frontend-node-modules:
