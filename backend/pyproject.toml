[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cohere>=7.0.9",
    "cryptography>=50.0.0",
    "docling>=2.113.0",
    "docling-core>=2.87.1",
    "dotenv>=0.9.9",
    "fastapi>=0.139.2",
    "httpx>=0.28.0",
    "langchain>=1.3.14",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "numpy>=2.5.1",
    "openai>=2.48.0",
    "pinecone[asyncio]>=8.1.0,<9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
    "rapidocr>=3.9.2",
    "rapidocr-onnxruntime>=1.4.4",
    "redis>=8.1.0",
    "sentencepiece>=0.2.2",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.39",
    "tavily-python>=0.8.0",
    "tiktoken>=0.13.0",
    "transformers>=5.8.1",
    "typing>=3.10.0.0",
    "uvicorn>=0.51.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.1",
    "httpx2>=0.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
