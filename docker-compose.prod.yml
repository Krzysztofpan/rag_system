services:
  backend:
    ports: !override []
    environment:
      APP_ENV: production
      CORS_ALLOW_ORIGINS: https://${DOMAIN:?Set DOMAIN to the public hostname}

  ingest-worker:
    environment:
      APP_ENV: production

  frontend:
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for Let's Encrypt}
    command:
      [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/Caddyfile.prod",
        "--adapter",
        "caddyfile",
      ]
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
