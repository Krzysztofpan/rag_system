name: rag
services:
  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--port", "${REDIS_PORT:-6379}", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  # Shared app image: API uses the image CMD; ingest-worker overrides command.
  # CD sets BACKEND_IMAGE to the ECR URI (repo name stays rag-backend).
  backend:
    image: ${BACKEND_IMAGE:-rag-app}
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
      APP_ENV: production
      CORS_ALLOW_ORIGINS: https://${DOMAIN:?Set DOMAIN to the public hostname}
    volumes:
      - uploads:/var/rag/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/live')" ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped
  ingest-worker:
    image: ${BACKEND_IMAGE:-rag-app}
    command: [ "python", "-m", "app.workers.ingest" ]
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
    volumes:
      - uploads:/var/rag/uploads
      - hf-cache:/var/rag/hf
      - xdg-cache:/var/rag/cache
    depends_on:
      redis:
        condition: service_healthy
    shm_size: "1gb"
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; from redis import Redis; Redis.from_url(os.environ['REDIS_URL']).ping()" ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped
  frontend:
    image: ${FRONTEND_IMAGE:-rag-frontend}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for Let's Encrypt}
    command: [ "caddy", "run", "--config", "/etc/caddy/Caddyfile.prod", "--adapter", "caddyfile" ]
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  uploads:
  hf-cache:
  xdg-cache:
  redis-data:
  caddy-data:
  caddy-config:
